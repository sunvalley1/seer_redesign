[build]
  base = "/"
  publish = "/web/dist/client/"
  command = "NODE_ENV=production yarn workspace @seer-pm/sdk build:showcase && yarn workspace @seer-pm/web build"

[build.environment]
  NODE_VERSION = "20.18.0"
  VITE_FUTARCHY_URL = "https://seer-redesign-futarchy.netlify.app/"
  VITE_DEEPFUND_URL = "https://seer-redesign-deep.netlify.app/"
  VITE_FORESIGHT_URL = "https://seer-redesign-risk.netlify.app/"

[functions]
  node_bundler = "esbuild"
  directory = "web/netlify/showcase-functions"

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/seer-api/*"
  to = "https://app.seer.pm/:splat"
  status = 200

[[redirects]]
  from = "/subgraph"
  to = "https://app.seer.pm/subgraph"
  status = 200

[[redirects]]
  from = "/all-markets-search"
  to = "https://app.seer.pm/all-markets-search"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200
